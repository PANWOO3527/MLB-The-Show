<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RTTS 사전">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1524" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<title>RTTS 토큰 능력치 사전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 한 화면 앱 — 상단 고정 헤더(제목+검색), 스크롤 리스트, 하단 고정 탭바 */
:root{
  --bg:#EEF1F4; --card:#FFFFFF; --ink:#14213A; --muted:#5B667A; --line:#D5DBE3;
  --stitch:#C62F2F; --hit:#1F5FBF; --pit:#C62F2F; --def:#2E7D5B; --chip:#E4E9F0; --bar:#FFFFFFEE;
  --c4s:#C62F2F; --csi:#C8721C; --csl:#1F5FBF; --csp:#7440C4; --cch:#2B7F52; --dotink:#FFFFFF; --zonefill:#F4F6F9;
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR",-apple-system,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --card:#172134; --ink:#E7ECF3; --muted:#9AA6BA; --line:#2A3650;
  --stitch:#FF6B5E; --hit:#6FA8FF; --pit:#FF6B5E; --def:#5FCB9A; --chip:#223049; --bar:#111A2BEE; --c4s:#FF6B5E; --csi:#F2A65A; --csl:#6FA8FF; --csp:#B794FF; --cch:#5FCB9A; --dotink:#0E1524; --zonefill:#1C2840; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1524; --card:#172134; --ink:#E7ECF3; --muted:#9AA6BA; --line:#2A3650;
  --stitch:#FF6B5E; --hit:#6FA8FF; --pit:#FF6B5E; --def:#5FCB9A; --chip:#223049; --bar:#111A2BEE; --c4s:#FF6B5E; --csi:#F2A65A; --csl:#6FA8FF; --csp:#B794FF; --cch:#5FCB9A; --dotink:#0E1524; --zonefill:#1C2840; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-inline:16px;padding-block:12px 10px}
.top-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--display);font-weight:400;font-size:1.45rem;margin:0;line-height:1.2}
.brand small{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;color:var(--stitch)}
.searchrow{display:flex;gap:8px}
#q{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#q:focus{outline:2px solid var(--hit);outline-offset:0}
#star{font:inherit;font-size:.85rem;font-weight:700;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
#star[aria-pressed="true"]{background:var(--stitch);border-color:var(--stitch);color:#fff}

main{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.group{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ghead{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.ghead .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ghead .en{font-family:var(--mono);font-weight:700;font-size:.82rem}
.ghead .ko{font-weight:700;font-size:1.02rem}
.ghead .sum{color:var(--muted);font-size:.82rem}
.hit .en{color:var(--hit)} .pit .en{color:var(--pit)} .def .en{color:var(--def)}
.item{padding:11px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.item:first-of-type{border-top:0}
.item .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item code{font-family:var(--mono);font-size:.78rem;font-weight:700;background:var(--chip);padding:2px 7px;border-radius:5px}
.item .kor{font-weight:700;font-size:.97rem}
.item .d{font-size:.9rem;color:var(--ink);opacity:.88}
.tag{font-size:.68rem;font-weight:700;padding:0 7px;border-radius:999px;border:1px solid currentColor;line-height:1.6}
.t-star{color:var(--stitch)} .t-c{color:var(--def)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.sec-label{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:4px 2px -6px}

.pci{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.pci svg{flex:0 0 92px;max-width:92px}
.pci p{margin:0;font-size:.85rem;min-width:0}
.pci b{color:var(--hit)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:1rem}
.card p,.card ol{margin:0;font-size:.9rem}
.card ol{padding-left:1.2em}
.card .k{font-family:var(--mono);font-size:.72rem;color:var(--stitch);letter-spacing:.08em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{font:inherit;background:none;border:0;color:var(--muted);padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:700;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] .ic{stroke:var(--tc)}
.tab:focus-visible{outline:2px solid var(--stitch);outline-offset:-4px;border-radius:8px}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:12px}
.seg button{flex:1;font:inherit;font-size:.85rem;font-weight:700;border:0;border-radius:9px;padding:7px 0;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.build{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.build .bh{padding:13px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;border-left:5px solid var(--bc)}
.build .bh .role{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;color:var(--bc)}
.build .bh h3{margin:0;font-size:1.08rem}
.build .bh p{margin:0;font-size:.85rem;color:var(--muted)}
.tier{display:grid;grid-template-columns:54px 1fr;gap:8px;padding:9px 14px;border-top:1px solid var(--line);align-items:start}
.tier:first-of-type{border-top:0}
.tier .lv{font-size:.72rem;font-weight:700;color:var(--muted);padding-top:4px}
.tier.p1 .lv{color:var(--stitch)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{font:inherit;font-family:var(--mono);font-size:.76rem;font-weight:700;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 8px;cursor:pointer;text-align:left}
.chip span{font-family:var(--body);font-weight:500;color:var(--muted);margin-left:4px}
.tier.p1 .chip{border-color:var(--stitch)}
.tier.skip .chip{opacity:.6;text-decoration:line-through;text-decoration-color:var(--muted)}
.btip{padding:10px 14px 12px;border-top:1px dashed var(--line);font-size:.85rem}
.btip b{color:var(--bc)}
.hint{font-size:.8rem;color:var(--muted);text-align:center;margin:0}
.tier.mix .chip{background:transparent;border-color:var(--pit)}
.plus{color:var(--muted);font-weight:700;align-self:center}
.why{padding:0 14px 10px 76px;font-size:.85rem;color:var(--muted)}
.why b{color:var(--ink)}
@media (max-width:420px){.why{padding-left:14px}}
.term .en{color:var(--stitch)}
.pv{display:flex;flex-direction:column;gap:12px}
.hands{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hands .lab{font-size:.72rem;font-weight:700;color:var(--muted);margin:0 0 4px 4px}
.matchup{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.88rem}
.matchup b{color:var(--pit)}
.zgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.zcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.zcard .cnt{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--pit);font-weight:700}
.zcard h3{margin:0;font-size:1rem}
.zcard .goal{margin:0;font-size:.84rem;color:var(--muted)}
.zsvg{width:100%;max-width:250px;align-self:center;display:block}
.leg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.leg li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.pdot{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:var(--pc);color:var(--dotink);font-family:var(--mono);font-size:.68rem;font-weight:700}
.leg b{font-weight:700}
.pkey{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;color:var(--muted)}
.pkey span{display:inline-flex;align-items:center;gap:5px}
.pkey i{width:10px;height:10px;border-radius:50%;background:var(--pc);display:inline-block}
.rolegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.rcard svg{width:96px;height:auto}
.rcard h4{margin:0;font-size:.95rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rcard .job{font-size:.72rem;font-weight:700;color:var(--muted)}
.rcard p{margin:4px 0 0;font-size:.82rem;min-width:0}
.ptips{margin:0;padding-left:1.1em;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
.card.tips{gap:10px}
.card.tips p{padding-top:10px;border-top:1px solid var(--line)}
.card.tips .k+p{border-top:0;padding-top:0}
@media (prefers-reduced-motion:no-preference){main{animation:fade .18s ease-out}}
@keyframes fade{from{opacity:.4}to{opacity:1}}
</style>

<div class="top"><div class="top-in">
  <div class="brand"><h1>RTTS 능력치 사전</h1><small>THE SHOW 26</small></div>
  <div class="searchrow">
    <input id="q" type="search" placeholder="영어·한국어 검색 (예: sinker, XBH, 제구)" autocomplete="off" aria-label="능력치 검색">
    <button id="star" type="button" aria-pressed="false">★ 핵심만</button>
  </div>
</div></div>

<main id="main" aria-live="polite"></main>

<nav class="tabbar" aria-label="탭"><div class="tabbar-in" role="tablist">
  <button class="tab" role="tab" data-tab="hit" style="--tc:var(--hit)"><svg viewBox="0 0 24 24"><path class="ic" d="M4 20 L16 8 M14 6 l4 4 M17 3 l4 4-3 3-4-4z"/></svg>타자</button>
  <button class="tab" role="tab" data-tab="pit" style="--tc:var(--pit)"><svg viewBox="0 0 24 24"><circle class="ic" cx="12" cy="12" r="8"/><path class="ic" d="M7 6c2 3 2 9 0 12M17 6c-2 3-2 9 0 12"/></svg>투수</button>
  <button class="tab" role="tab" data-tab="def" style="--tc:var(--def)"><svg viewBox="0 0 24 24"><path class="ic" d="M6 10a6 6 0 0 1 12 0v4a6 6 0 0 1-12 0z M9 8v6 M12 7v7 M15 8v6"/></svg>수비·주루</button>
  <button class="tab" role="tab" data-tab="build" style="--tc:var(--stitch)"><svg viewBox="0 0 24 24"><circle class="ic" cx="12" cy="8" r="4"/><path class="ic" d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>빌드</button>
  <button class="tab" role="tab" data-tab="guide" style="--tc:var(--ink)"><svg viewBox="0 0 24 24"><path class="ic" d="M5 4h10l4 4v12H5z M9 12h6 M9 16h6"/></svg>가이드</button>
</div></nav>

<script>
const D={
hit:[
 {en:"CONTACT",ko:"컨택 · 맞히는 능력",sum:"PCI(타격 커서)를 키워 안타 확률을 올리는 기본기",items:[
  ["Contact vs L","좌투수 상대 컨택",1,"왼손 투수 상대 PCI가 커짐"],
  ["Contact vs R","우투수 상대 컨택",1,"오른손 투수 상대 PCI 증가. 우투수가 더 많아 L보다 먼저"],
  ["Plate Vision","선구안(시야)",0,"좌우 상관없이 PCI 전체 크기 증가. 삼진 감소"],
  ["Clutch","득점권 타격(클러치)",0,"2·3루 주자가 있으면 Contact 대신 적용"]]},
 {en:"POWER",ko:"파워 · 장타력",sum:"타구 속도를 올려 장타와 홈런을 만듦",items:[
  ["Power vs L","좌투수 상대 파워",0,"왼손 투수 상대 타구 힘 증가"],
  ["Power vs R","우투수 상대 파워",1,"오른손 투수 상대 타구 힘 증가. 거포형 최우선"]]},
 {en:"OTHER",ko:"기타 타격",sum:"Other 그룹 안의 타자용 항목",items:[
  ["Plate Discipline","타석 인내심",0,"체크 스윙 성공률 증가. 볼에 헛스윙 감소"],
  ["Bunting","희생 번트",0,"번트를 제대로 대는 능력"],
  ["Drag Bunting","기습 번트",0,"번트로 안타를 만드는 능력. 발 빠른 타자용"]]}
],
pit:[
 {en:"STUFF",ko:"구위 · 공의 위력",sum:"상대 타자의 PCI를 줄여 치기 어렵게 만듦",items:[
  ["H/9 R","우타자 피안타 억제",1,"오른손 타자 PCI 안쪽(정타 구역) 축소"],
  ["H/9 L","좌타자 피안타 억제",0,"왼손 타자 상대 같은 효과"],
  ["K/9 R","우타자 탈삼진",1,"오른손 타자 PCI 바깥 축소 → 헛스윙 유도"],
  ["K/9 L","좌타자 탈삼진",0,"왼손 타자 상대 같은 효과"],
  ["HR/9","피홈런 억제",0,"주로 시뮬레이션 결과에 반영. 우선순위 낮음"],
  ["Pitching Clutch","위기관리(투수 클러치)",0,"득점권 위기에서 H/9·K/9 대신 적용. Bear Down 충전·사용 횟수 증가"]]},
 {en:"OTHER",ko:"기타 투수",sum:"Other 그룹 안의 투수용 항목",items:[
  ["Control","제구력",1,"원하는 곳에 던지는 능력. 공마다 완벽 정확도 구역(PAR) 크기"],
  ["Stamina","체력",0,"오래 던져도 덜 지침. 선발 필수"]]},
 {en:"PITCHES",ko:"구종별 능력치",sum:"포심·슬라이더 등 구종마다 따로 있는 수치",items:[
  ["Velocity","구속",0,"그 구종의 최고 속도. 구종 간 속도 차이가 클수록 유리"],
  ["Control","구종 제구",0,"해당 구종만의 제구 정확도"],
  ["Break","무브먼트(변화량)",0,"휘거나 떨어지는 정도. 변화구의 핵심"]]},
 {en:"PITCH TYPES",ko:"구종 이름",sum:"투수 생성·구종 선택 화면에 나오는 영어 구종명",items:[

  ["2-Seam Fastball","투심 패스트볼",0,"포심보다 조금 느리고 던지는 팔 쪽으로 살짝 휘며 가라앉음"],

  ["Slider","슬라이더",0,"빠르게 옆으로 꺾이며 살짝 떨어짐. 대표적 헛스윙 구종"],
  ["Sweeper","스위퍼",0,"슬라이더보다 옆으로 훨씬 크게 휘는 공"],

  ["Knuckle Curve","너클 커브",0,"커브보다 빠르고 날카롭게 떨어짐"],
  ["Slurve","슬러브",0,"슬라이더와 커브의 중간. 대각선으로 휨"],
  ["Changeup","체인지업",0,"직구 폼으로 던지지만 느린 공. 타이밍 뺏기"],
  ["Circle Change","서클 체인지업",0,"체인지업에 휘는 움직임이 더해진 공"],
  ["Splitter","스플리터",0,"직구처럼 오다 홈플레이트 앞에서 뚝 떨어짐. 삼진용"],
  ["Forkball","포크볼",0,"스플리터보다 느리고 더 크게 떨어짐"],
  ["Knuckleball","너클볼",0,"회전이 거의 없어 예측 불가하게 흔들림. 특수 구종"]]}
],
def:[
 {en:"FIELDING",ko:"수비",sum:"타구 처리 범위와 반응",items:[

function buildHTML(){
  const segs=[['all','전체'],['pit','투수'],['hit','타자'],['def','수비']];
  let h=`<div class="seg" role="group" aria-label="빌드 종류">${segs.map(([k,l])=>`<button type="button" data-bf="${k}" aria-pressed="${bf===k}">${l}</button>`).join('')}</div><p class="hint">능력치 칩을 누르면 뜻을 바로 볼 수 있습니다.</p>`;
  const kor=n=>{for(const k of ['pit','hit','def'])for(const g of D[k])for(const it of g.items)if(it[0]===n)return it[1];return '';};
  const chip=n=>`<button type="button" class="chip" data-q="${esc(n)}">${esc(n)}<span>${esc(kor(n))}</span></button>`;
  B.filter(b=>bf==='all'||b.k===bf||(bf==='hit'&&b.k==='two')).forEach(b=>{
    h+=`<div class="build" style="--bc:${BC[b.k]}"><div class="bh"><span class="role">${b.role}</span><h3>${b.name}</h3><p>${b.desc}</p></div>`;
    b.t.forEach((arr,i)=>h+=`<div class="tier${i===0?' p1':''}"><span class="lv">${i+1}순위</span><div class="chips">${arr.map(chip).join('')}</div></div>`);
    h+=`<div class="tier skip"><span class="lv">후순위</span><div class="chips">${b.skip.map(chip).join('')}</div></div>`;
    if(b.mix) h+=`<div class="tier mix"><span class="lv">구종<br>조합</span><div class="chips">${b.mix.map(chip).join('<span class="plus">+</span>')}</div></div><div class="why">${b.why}</div>`;
    h+=`<div class="btip">${b.tip}</div></div>`;
  });
  return h;
}

<div class="sec-label">토큰 쓰는 법</div>
<div class="card"><span class="k">STEP 1</span><h3>토큰 모으기</h3><p>플레이마다 화면에 뜨는 <b style="color:var(--def)">초록 +</b>/<b style="color:var(--stitch)">빨강 −</b> 숫자가 토큰 점수입니다. <b>100점이 모이면 토큰 1개</b>가 됩니다. 경기 전 챌린지와 훈련 미니게임 Gold 등급으로도 받습니다.</p></div>
<div class="card"><span class="k">STEP 2</span><h3>메뉴 찾기</h3><p>RTTS 메인 화면 오른쪽 위 공구 아이콘(Tools)에서 업그레이드 메뉴로 들어갑니다.</p></div>
<div class="card"><span class="k">STEP 3</span><h3>투자하기</h3><p>Contact 같은 그룹 전체에 넣거나 세부 능력치 하나만 골라 올립니다.</p></div>
<div class="sec-label">놓치기 쉬운 꿀팁</div>
<div class="card tips"><span class="k">토큰 더 받기</span>
<p><b>경기 전 챌린지 창을 건너뛰지 마세요.</b> Dynamic Challenge는 토큰 배수나 보너스를, Boss Challenge는 능력치 보너스를 줍니다. 가장 어려운 목표를 골라야 보상이 큽니다.</p>
<p><b>투수는 삼진만 점수가 아닙니다.</b> 루킹 스트라이크(Called), 코너 스트라이크(Edge), 무실점 이닝도 점수라 한가운데보다 코너를 노리세요.</p>
<p><b>타자는 안타 말고도 점수가 쌓입니다.</b> 공을 많이 보며 볼카운트를 끌거나, 수비에서 보살을 기록해도 인정됩니다.</p>
<p><b>난이도는 토큰 양과 거의 상관없습니다.</b> 초반에는 난이도를 낮춰 좋은 성적으로 토큰을 모으고, 능력치가 오른 뒤 올려도 됩니다.</p></div>
<div class="card tips"><span class="k">성장·장비</span>
<p><b>퍽 해금 조건은 영어로 적혀 있습니다.</b> 예: 'Vision of 80+'는 선구안 80 이상, 'Tally 10 career XBH'는 통산 장타 10개. 아래 용어 사전을 참고하세요. 해금한 퍽도 토큰으로 레벨업하면 더 자주 발동합니다.</p>
<p><b>장비는 능력치가 아니라 퍽을 강화합니다.</b> 등급별로 Diamond 6%, Gold 4%, Silver 2%입니다. 10경기마다 무료 장비 상자(Care Package)가 오니 확인하고 장착하세요.</p>
<p><b>승격이 궁금하면 Outlook 화면</b>의 진행 바를 보세요. OVR, 능력치, 성적이 모두 반영됩니다.</p>
<p><b>고졸 vs 대학</b>: 고졸은 프로 입단이 3년 빠르고 한동안 토큰 2배. 대학은 토큰은 적지만 학교별 성장 보너스와 포지션 퍽을 줍니다.</p></div>
<div class="card tips"><span class="k">조작 쉽게</span>
<p><b>타격이 어려우면 Fixed Zone(고정 존) 타격</b>을 켜 보세요. 26 신규 모드로, PCI가 내가 둔 위치에 고정됩니다. PCI 민감도는 70% 전후가 무난합니다.</p>
<p><b>Bear Down</b>: 위기 상황에 투구 전 L2(Xbox는 LT)를 누르면 강화 투구가 됩니다. 횟수가 한정되니 경기 후반 위기를 위해 아껴 두세요.</p></div>
<div class="card tips"><span class="k">커리어</span>
<p><b>잘 맞을 땐 Sim, 슬럼프일 땐 직접 플레이</b>하는 게 성적 관리에 유리합니다. 기록이 걸린 경기는 직접 하세요.</p>
<p><b>트레이드를 원하면</b> 홈 화면 메시지 아이콘으로 에이전트에게 요청할 수 있습니다.</p></div>
<div class="sec-label">영어 용어 사전</div>`;

function render(){
  const term=q.value.trim().toLowerCase(), onlyStar=star.getAttribute('aria-pressed')==='true';
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab && !term ? 'true':'false'));
  const match=it=>(!onlyStar||it[2]===1)&&(!term||(it[0]+' '+it[1]+' '+it[3]).toLowerCase().includes(term));
  let html='';
  if(term||onlyStar){
    const keys=(term||!D[tab]||tab==='term')?(term?['hit','pit','def','term']:['hit','pit','def']):[tab];
    keys.forEach(k=>D[k].forEach(g=>{const its=g.items.filter(match); if(its.length) html+=groupHTML({...g,en:TAB_KO[k]+' · '+g.en},k,its);}));
    if(!html) html=`<div class="empty">'${esc(q.value)}'에 맞는 능력치·용어가 없습니다.<br>영어 이름 일부(예: arm, clutch)로 검색해 보세요.</div>`;
  } else if(tab==='guide'){ html=GUIDE; D.term.forEach(g=>html+=groupHTML(g,'term',g.items)); }
  else if(tab==='build'){ html=buildHTML(); }
  else if(tab==='pit'){
    html=`<div class="seg" role="group" aria-label="투수 보기"><button type="button" data-pv="plan" aria-pressed="${pv==='plan'}">볼배합</button><button type="button" data-pv="stat" aria-pressed="${pv==='stat'}">능력치</button></div>`;
    if(pv==='plan') html+=planHTML(); else { html+=MIXCARD; D.pit.forEach(g=>html+=groupHTML(g,'pit',g.items)); }
  }
  else { if(tab==='hit') html+=PCI; D[tab].forEach(g=>html+=groupHTML(g,tab,g.items)); }
  main.innerHTML=html;
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  tab=b.dataset.tab; q.value=''; try{localStorage.setItem('rtts-tab',tab)}catch(e){}
  render(); window.scrollTo(0,0);
}));
q.addEventListener('input',render);
main.addEventListener('click',e=>{
  const s=e.target.closest('[data-bf]'); if(s){bf=s.dataset.bf;render();return;}
  const v=e.target.closest('[data-pv],[data-ph],[data-bh]');
  if(v){const d=v.dataset; if(d.pv)pv=d.pv; if(d.ph)ph=d.ph; if(d.bh)bh=d.bh;
    try{localStorage.setItem('rtts-pv',pv);localStorage.setItem('rtts-ph',ph);localStorage.setItem('rtts-bh',bh);}catch(err){}
    render();return;}
  const c=e.target.closest('[data-q]'); if(c){q.value=c.dataset.q;render();window.scrollTo(0,0);}
});
star.addEventListener('click',()=>{star.setAttribute('aria-pressed',star.getAttribute('aria-pressed')==='true'?'false':'true');render();});
render();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body></html>
